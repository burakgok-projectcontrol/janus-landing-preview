<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janus metro sahnesi</title>
<style>
  html, body { margin: 0; height: 100%; background: #07111F; color: #e6edf7; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); background: rgba(19, 31, 54, .88); border: 1px solid #22304d; border-radius: 14px; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 14px; align-items: center; backdrop-filter: blur(8px); z-index: 2; }
  .bar button { background: #111C2B; color: inherit; border: 1px solid #22304d; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
  .bar .phase { grid-column: 1 / -1; color: #9fb0c9; font-size: 13px; }
  .bar .phase b { color: #e6edf7; font-weight: 600; }
  .pct { font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #35C7E8; }
  .labels-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .note { position: fixed; top: 14px; right: 16px; font-size: 12px; color: #9fb0c9; z-index: 2; opacity: 0; transition: opacity .4s; }
  .embed .bar { display: none; }
  .embed .note { top: auto; bottom: 14px; }
  @media (max-width: 700px) { .embed .note { top: 58px; bottom: auto; right: 14px; } }
  /* Ring counter: an indicator card standing over the machine, with a marker line down to it. */
  .evm-label.ring { min-width: 0; }
  .evm-label.ring b { font-variant-numeric: tabular-nums; }
  .evm-label.mg { color: #86efac; }
  .evm-label.hr { color: #fcd34d; font-weight: 700; }
  @media (max-width: 600px) { .evm-label.mg { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="note" id="note">Örnek senaryo · temsilî değerler</div>
<div class="bar">
  <button id="play" aria-pressed="true" aria-label="Oynat / duraklat">❚❚</button>
  <input id="prog" type="range" min="0" max="1000" value="0" aria-label="Yapım ilerlemesi">
  <span class="pct" id="pct">0%</span>
  <div class="phase" id="phase"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { chartStyles, chartPanel, stripStyles } from './evm.js';
import { createBackdrop, createSheet } from './sheet.js';
import { t, num, pct, EN, LANG } from './i18n.js';
document.documentElement.lang = LANG; // uppercase labels follow the language's rules (TR "HALKA", EN "RING", not "RİNG")
import { warmUp, pause } from './warmup.js';
chartStyles();
document.getElementById('note').textContent = t('Örnek senaryo · temsilî değerler', 'Sample scenario · illustrative values');

// ?embed: driven by the landing page (no own controls, progress set from outside); ?lite: lighter rendering for phones.
const QS = new URLSearchParams(location.search);
const EMBED = QS.has('embed'), LITE = QS.has('lite');
if (EMBED) document.body.classList.add('embed');

// World in metres, drawn as a long section: the cut face is the plane z = 0 through the tunnel axis, so the back half
// of the tunnel (rings, machine) shows through it. x runs along the tunnel from the launch shaft (x < 0) to the
// arrival station (x > L). The length is compressed (the drawing says ~1,8 km); the depth is to scale.
const L = 120;                 // tunnel length from the shaft wall to the station head wall
const AXIS = -12;              // tunnel axis depth
const R_IN = 2.85, R_OUT = 3.15, R_BORE = 3.3;
const RINGS = 1200, RING_M = 1.5;   // sample scenario: 1.200 rings of 1,5 m ≈ 1,8 km
const RW = LITE ? 1.5 : 0.75;       // width of one drawn ring (each stands for several real ones)
const NR = Math.ceil(L / RW);
const SHAFT = { x0: -9, x1: 0, z0: -5, y0: -17 };
const STATION = { x0: L, x1: L + 26, y0: -15.6, y1: -4, z0: -12 };
const FX0 = -34, FX1 = L + 52, FY0 = -28; // extent of the cut face
const HARD = [0.23, 0.33];          // hard rock band, as a share of the tunnel length
const SHIELD = 7.5;                 // shield length (cutterhead front to tail)

const smooth = v => v * v * (3 - 2 * v);
const clamp01 = v => Math.min(1, Math.max(0, v));
const ramp = (c, a, b) => smooth(clamp01((c - a) / (b - a)));
const int = v => Math.round(v).toLocaleString(EN ? 'en-US' : 'tr-TR');

// ------------------------------------------------------------------ renderer, camera, light
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, LITE ? 1.25 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = 'labels-layer';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const backdrop = createBackdrop('metro');
scene.background = backdrop.texture;
scene.fog = new THREE.Fog('#07111F', 160, 360);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 1500);
camera.position.set(14, 8, 62);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-2, -6, -2);
controls.enableDamping = true;

const hemi = new THREE.HemisphereLight('#dbe7ff', '#1a2440', 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.3);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(LITE ? 1024 : 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 40, bottom: -40, near: 1, far: 260 });
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(45, 60, 90);

// Cinematic look on wide screens (phones keep the light set-up above): a low, warm raking light, a cool fill, depth
// haze, a slow camera drift and a soft glow on the brightest parts (same recipe as the other scenes).
const CINE = !LITE;
const HAZE = '#14315c';
if (CINE) {
  sun.color.set('#ffe8cc');
  renderer.toneMappingExposure = 1.3;
  sun.intensity = 3.2;
  SUN_OFF.set(70, 45, 75);
  hemi.color.set('#9cc2ff');
  hemi.groundColor.set('#0a1830');
  scene.fog.color.set(HAZE);
  scene.fog.near = 130;
  scene.fog.far = 340;
} else scene.fog.color.set(HAZE);
let post = null;
if (CINE && !QS.has('nopost')) {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js'),
  ]);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.78));
  composer.addPass(new OutputPass());
  post = { composer, target: composer.readBuffer, render: () => composer.render(), setSize: (w, h) => { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); } };
}

// ------------------------------------------------------------------ blueprint materials
const bp = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 1, ...extra });
const glow = (color, k = 1) => bp(color, { emissive: color, emissiveIntensity: k });
const EDGE = new THREE.LineBasicMaterial({ color: '#cfe8ff', transparent: true, opacity: 0.7 });
const M = {
  ground: bp('#123468'),
  street: bp('#0e2c5e'),
  walk: bp('#16407f'),
  city: bp('#16407f', { transparent: true, opacity: 0.85 }),
  cavity: bp('#0a2250', { side: THREE.BackSide }),
  bore: bp('#0b2452', { side: THREE.DoubleSide }),
  ring: bp('#1f539e'),
  concrete: bp('#1c4d96'),
  machine: bp('#1a4589', { side: THREE.DoubleSide }),
  steel: bp('#2b62b5'),
  dark: bp('#10306a'),
  cutter: bp('#3a74c8'),
  muck: bp('#3b5f99'),
  car: bp('#2a5aa8'),
  cyan: glow('#35C7E8', 1),
  lamp: glow('#bfe9ff', 0.6),
  bit: glow('#35C7E8', 0.9),
  flash: glow('#35C7E8', 1.4),
  worker: bp('#5eead4', { emissive: '#35C7E8', emissiveIntensity: 0.7 }),
};
M.flash.transparent = true;
const geo = {
  box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
  cylX: (r, l, n = 24) => new THREE.CylinderGeometry(r, r, l, n).rotateZ(Math.PI / 2),
  cylZ: (r, l, n = 16) => new THREE.CylinderGeometry(r, r, l, n).rotateX(Math.PI / 2),
  cylY: (r, l, n = 16) => new THREE.CylinderGeometry(r, r, l, n),
};
function mesh(g, mat, parent = scene, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(g, typeof mat === 'string' ? M[mat] : mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const group = (parent = scene, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };

await pause(); // start-up in slices (see warmup.js)
// ------------------------------------------------------------------ cut face: soil layers drawn on a canvas
// Ground layers (fill, clay, sandstone with a hard rock band), the planned tunnel outline, chainage and a dimension
// line. Shaft and station are holes in the drawing; the bored part of the tunnel is cut out in the shader.
const yClay = x => -2.5 + 0.3 * Math.sin(x * 0.08);
const ySand = x => -8 + 0.8 * Math.sin(x * 0.045 + 1);
const HX0 = HARD[0] * L, HX1 = HARD[1] * L;
function drawFace() {
  const S = LITE ? 12 : 19;
  const c = document.createElement('canvas');
  c.width = Math.round((FX1 - FX0) * S);
  c.height = Math.round(-FY0 * S);
  // CPU-backed canvas, layer textures as small repeating tiles: drawn once, so this is far cheaper than thousands of
  // clipped strokes on an accelerated canvas (that took seconds with software GPU).
  const g = c.getContext('2d', { willReadFrequently: true });
  const X = x => (x - FX0) * S, Y = y => -y * S;
  const INK = a => `rgba(170, 214, 255, ${a})`;
  const tile = (w, h, draw) => {
    const tc = document.createElement('canvas');
    tc.width = Math.max(2, Math.round(w)); tc.height = Math.max(2, Math.round(h));
    const tg = tc.getContext('2d');
    tg.lineWidth = Math.max(1, S / 16);
    draw(tg, tc.width, tc.height);
    return g.createPattern(tc, 'repeat');
  };
  const layer = (top, bottom, fill, pat) => {
    const p = new Path2D();
    p.moveTo(X(FX0), Y(top(FX0)));
    for (let x = FX0; x <= FX1; x += 2) p.lineTo(X(x), Y(top(x)));
    for (let x = FX1; x >= FX0; x -= 2) p.lineTo(X(x), Y(bottom(x)));
    p.closePath();
    g.fillStyle = fill;
    g.fill(p);
    g.fillStyle = pat;
    g.fill(p);
    return p;
  };
  const diag = (a, step, cross) => tile(step, step, (tg, w, h) => {
    tg.strokeStyle = INK(a);
    tg.beginPath();
    for (const o of [-w, 0, w]) { tg.moveTo(o, h); tg.lineTo(o + w, 0); if (cross) { tg.moveTo(o, 0); tg.lineTo(o + w, h); } }
    tg.stroke();
  });
  layer(() => 0, yClay, '#163a74', diag(0.18, S * 0.9));
  layer(yClay, ySand, '#11306a', tile(S * 2.2, S * 1.4, (tg, w, h) => {
    tg.strokeStyle = INK(0.2);
    tg.beginPath(); tg.moveTo(0, h * 0.25); tg.lineTo(S, h * 0.25); tg.moveTo(S * 1.1, h * 0.75); tg.lineTo(S * 2.1, h * 0.75); tg.stroke();
  }));
  layer(ySand, () => FY0, '#0c2858', tile(S * 1.6, S * 1.6, (tg, w, h) => {
    tg.fillStyle = INK(0.22);
    const d = Math.max(1.5, S * 0.12);
    tg.fillRect(w * 0.2, h * 0.25, d, d); tg.fillRect(w * 0.7, h * 0.75, d, d);
  }));
  // Hard rock band, a lens across the tunnel.
  const mid = (HX0 + HX1) / 2;
  const hard = new Path2D();
  hard.moveTo(X(HX0 - 3), Y(-20));
  hard.bezierCurveTo(X(HX0 - 2), Y(-11), X(HX0), Y(-7.2), X(mid - 2), Y(-6.6));
  hard.bezierCurveTo(X(mid + 4), Y(-6.2), X(HX1), Y(-7.6), X(HX1 + 2), Y(-12));
  hard.bezierCurveTo(X(HX1 + 3), Y(-17), X(HX1), Y(-21.5), X(mid), Y(-21.8));
  hard.bezierCurveTo(X(HX0 + 2), Y(-22), X(HX0 - 3), Y(-21), X(HX0 - 3), Y(-20));
  g.fillStyle = '#1d4486';
  g.fill(hard);
  g.fillStyle = diag(0.32, S * 0.55, true);
  g.fill(hard);
  g.strokeStyle = INK(0.75); g.lineWidth = Math.max(1.5, S / 9); g.stroke(hard);
  // Layer boundaries.
  g.strokeStyle = INK(0.55); g.lineWidth = Math.max(1, S / 12);
  for (const f of [yClay, ySand]) { g.beginPath(); for (let x = FX0; x <= FX1; x += 2) g.lineTo(X(x), Y(f(x))); g.stroke(); }
  // Planned tunnel outline and axis (dashed).
  g.setLineDash([S * 0.8, S * 0.5]);
  g.strokeStyle = INK(0.6);
  g.beginPath();
  for (const y of [AXIS + R_BORE, AXIS - R_BORE]) { g.moveTo(X(0), Y(y)); g.lineTo(X(L), Y(y)); }
  g.stroke();
  g.setLineDash([S * 2, S * 0.4, S * 0.3, S * 0.4]);
  g.strokeStyle = INK(0.35);
  g.beginPath(); g.moveTo(X(FX0 + 2), Y(AXIS)); g.lineTo(X(FX1 - 2), Y(AXIS)); g.stroke();
  g.setLineDash([]);
  // Labels.
  const text = (s, x, y, size = 0.75, a = 0.85, align = 'left') => {
    g.font = `700 ${Math.round(size * S)}px system-ui, sans-serif`;
    g.fillStyle = INK(a); g.textAlign = align; g.fillText(s, X(x), Y(y));
  };
  text(t('DOLGU', 'FILL'), FX0 + 2, -1.6, 0.7, 0.75);
  text(t('KİL', 'CLAY'), FX0 + 2, -5.6, 0.7, 0.75);
  text(t('KUMTAŞI', 'SANDSTONE'), FX0 + 2, -14, 0.7, 0.75);
  text(t('SERT KAYA', 'HARD ROCK'), mid, -18.6, 0.8, 0.95, 'center');
  text(t('GİRİŞ ŞAFTI', 'LAUNCH SHAFT'), (SHAFT.x0 + SHAFT.x1) / 2, SHAFT.y0 - 1.3, 0.6, 0.8, 'center');
  text(t('VARIŞ İSTASYONU', 'ARRIVAL STATION'), (STATION.x0 + STATION.x1) / 2, STATION.y0 - 1.4, 0.65, 0.8, 'center');
  text(t('TÜNEL EKSENİ', 'TUNNEL AXIS'), L + 32, AXIS + 0.4, 0.55, 0.6);
  // Chainage and the overall dimension.
  const dy = -24.5;
  g.strokeStyle = INK(0.65); g.lineWidth = Math.max(1, S / 12);
  g.beginPath();
  g.moveTo(X(0), Y(dy)); g.lineTo(X(L), Y(dy));
  for (let k = 0; k <= 4; k++) { const x = (L * k) / 4; g.moveTo(X(x), Y(dy + 0.6)); g.lineTo(X(x), Y(dy - 0.6)); }
  for (const x of [0, L]) { g.moveTo(X(x) - S * 0.4, Y(dy - 0.4)); g.lineTo(X(x) + S * 0.4, Y(dy + 0.4)); }
  g.stroke();
  g.font = `600 ${Math.round(0.55 * S)}px ui-monospace, Consolas, monospace`;
  g.fillStyle = INK(0.75); g.textAlign = 'center';
  for (let k = 0; k <= 4; k++) { const m = (1800 * k) / 4; g.fillText(`Km ${Math.floor(m / 1000)}+${String(m % 1000).padStart(3, '0')}`, X((L * k) / 4), Y(dy - 1.4)); }
  text(`≈ ${num(1.8, 1)} km · ${int(RINGS)} ${t('halka', 'rings')}`, L / 2 + L / 8, dy + 0.5, 0.65, 0.85, 'center');
  // Holes: shaft and station.
  g.clearRect(X(SHAFT.x0), Y(0) - 1, (SHAFT.x1 - SHAFT.x0) * S, -SHAFT.y0 * S + 1);
  g.clearRect(X(STATION.x0), Y(STATION.y1), (STATION.x1 - STATION.x0) * S, (STATION.y1 - STATION.y0) * S);
  // Edge of the cut.
  g.strokeStyle = INK(0.8); g.lineWidth = Math.max(1.5, S / 8);
  g.strokeRect(X(SHAFT.x0), Y(0), (SHAFT.x1 - SHAFT.x0) * S, -SHAFT.y0 * S);
  g.strokeRect(X(STATION.x0), Y(STATION.y1), (STATION.x1 - STATION.x0) * S, (STATION.y1 - STATION.y0) * S);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const cut = { value: 0 }; // the face is open along the tunnel up to this x (the cutterhead)
const faceMat = new THREE.MeshStandardMaterial({ map: drawFace(), roughness: 1, alphaTest: 0.5 });
faceMat.onBeforeCompile = sh => {
  sh.uniforms.uCut = cut;
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;\nuniform float uCut;')
    .replace('void main() {', `void main() {\n if (vW.x > -0.01 && vW.x < uCut && abs(vW.y - (${AXIS.toFixed(2)})) < ${R_BORE.toFixed(2)}) discard;`);
};
const face = mesh(new THREE.PlaneGeometry(FX1 - FX0, -FY0), faceMat, scene, (FX0 + FX1) / 2, FY0 / 2, 0);
face.castShadow = false;
face.userData.noEdges = true;
// Block ends and the ground surface (with the shaft opening).
const DEPTH = 30;
mesh(geo.box(0.4, -FY0, DEPTH), 'ground', scene, FX0 + 0.2, FY0 / 2, -DEPTH / 2);
mesh(geo.box(0.4, -FY0, DEPTH), 'ground', scene, FX1 - 0.2, FY0 / 2, -DEPTH / 2);
const slab = (x0, x1, z0, z1, mat = 'ground', h = 0.4) => mesh(geo.box(x1 - x0, h, z1 - z0), mat, scene, (x0 + x1) / 2, -h / 2, (z0 + z1) / 2);
slab(FX0, SHAFT.x0, -DEPTH, 0);
slab(SHAFT.x1, FX1, -DEPTH, 0);
slab(SHAFT.x0, SHAFT.x1, -DEPTH, SHAFT.z0);

await pause();
// ------------------------------------------------------------------ street, buildings, traffic
const ST = { z0: -13, z1: -5 };
mesh(geo.box(FX1 - FX0, 0.08, ST.z1 - ST.z0), 'street', scene, (FX0 + FX1) / 2, 0.04, (ST.z0 + ST.z1) / 2).userData.noEdges = true;
for (const z of [ST.z0 - 1, ST.z1 + 1]) mesh(geo.box(FX1 - FX0, 0.18, 2), 'walk', scene, (FX0 + FX1) / 2, 0.09, z).userData.noEdges = true;
{
  const pts = [];
  for (let x = FX0 + 2; x < FX1 - 4; x += 6) pts.push(new THREE.Vector3(x, 0.1, (ST.z0 + ST.z1) / 2), new THREE.Vector3(x + 3, 0.1, (ST.z0 + ST.z1) / 2));
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), EDGE));
}
const rnd = (i => () => ((i = (i * 9301 + 49297) % 233280) / 233280))(11);
for (let x = FX0 + 6; x < FX1 - 4; x += 10 + rnd() * 3) {
  const w = 7 + rnd() * 2, d = 7 + rnd() * 5, h = 3.5 + rnd() * 8;
  mesh(geo.box(w, h, d), 'city', scene, x, h / 2, -16 - d / 2 - rnd() * 2);
}
// Station entrance on the street side.
mesh(geo.box(7, 3, 3), 'concrete', scene, STATION.x0 + 10, 1.5, -2.2);
mesh(geo.box(7.6, 0.3, 3.6), 'steel', scene, STATION.x0 + 10, 3.15, -2.2);
mesh(geo.box(1.4, 1.4, 0.2), 'cyan', scene, STATION.x0 + 6.2, 4.4, -0.6).castShadow = false;
mesh(geo.cylY(0.08, 1.2), 'steel', scene, STATION.x0 + 6.2, 3.4, -0.6);
// Cars on two lanes.
const cars = [];
const NCAR = LITE ? 4 : 7;
for (let lane = 0; lane < 2; lane++) for (let k = 0; k < NCAR; k++) {
  const c = group(scene, 0, 0, lane ? ST.z0 + 2 : ST.z1 - 2);
  mesh(geo.box(4, 1, 1.8), 'car', c, 0, 0.75, 0);
  mesh(geo.box(2, 0.7, 1.6), 'dark', c, -0.2, 1.6, 0);
  c.userData = { lane, off: (k / NCAR) * (FX1 - FX0) + rnd() * 8, v: 7 + rnd() * 3 };
  if (lane) c.rotation.y = Math.PI;
  cars.push(c);
}

await pause();
// ------------------------------------------------------------------ launch shaft, site, gantry crane
const shaftBox = mesh(geo.box(SHAFT.x1 - SHAFT.x0, -SHAFT.y0 + 0.2, -SHAFT.z0), 'cavity', scene, (SHAFT.x0 + SHAFT.x1) / 2, SHAFT.y0 / 2 + 0.1, SHAFT.z0 / 2);
shaftBox.castShadow = false;
mesh(geo.box(9, 0.5, 5), 'concrete', scene, (SHAFT.x0 + SHAFT.x1) / 2, SHAFT.y0 + 0.25, -2.5); // shaft floor
mesh(geo.box(8, 0.6, 2.8), 'steel', scene, -4.2, AXIS - 3.0, 0); // launch cradle
// Gantry crane over the shaft: portal frame, trolley, hoist.

  const tr = ramp(bk, 0.42, 1);

  rails.scale.x = bk > 0 ? L - SHAFT.x0 : Math.max(0.01, sx - SHIELD - 0.4 - SHAFT.x0);

  // Gantry crane: lowers the machine, then sends ring segments down the shaft.
  const hookX = -SHIELD / 2 - 0.2;

  segLoad.position.y = hookY - 1.6;

  trailers.forEach((tr, k) => {
    const back = SHIELD + 1.6 + TRAILER / 2 + k * (TRAILER + GAP);
    const shaftMid = (SHAFT.x0 + SHAFT.x1) / 2;
    const at = shaftMid + back; // shield position at which this trailer sits in the middle of the shaft
    const drop = clamp01((sx - (at - 4)) / 4);

  for (let i = 0; i < PATH.length - 1; i++) total += PATH[i].distanceTo(PATH[i + 1]);

    const d = (j * MUCK_GAP + t * 3.2) % (NMUCK * MUCK_GAP);
    if (d > total || !pointOnPath(d, v3)) continue;

  const span = FX1 - FX0 - 8;
  for (const car of cars) {
    const u = (car.userData.off + t * car.userData.v) % span;
    car.position.x = car.userData.lane ? FX1 - 4 - u : FX0 + 4 + u;
  }

  setCounter(Math.round(f * RINGS), Math.min(sx, L) - SHIELD / 2, c > C0 * 0.6);
}

{

const evmText = () => t(
  `<b>Ölçüm · ay ${MONTHS} · halka ${int(TODAY_RINGS)}</b> · sert kaya aylarında maliyet gelire dayandı; kazanılmış marj %${num(KPI.margin, 1)} (plan %12). Kazanılan gelirin %${Math.round(KPI.unbilled)}'sı henüz faturalanmadı.`,
  `<b>Measurement · month ${MONTHS} · ring ${int(TODAY_RINGS)}</b> · in the hard rock months cost reached revenue; earned margin ${num(KPI.margin, 1)}% (plan 12%). ${Math.round(KPI.unbilled)}% of earned revenue is not billed yet.`);

// Story steps (the page drives P = 0..1): boring up to "today" (P 0.5), the chart (to 0.75), back to the tunnel
// (to 0.82), then on to the station, the breakthrough and the first train.
const T = { evmIn: 0.5, evmShown: 0.75, evmOut: 0.82, arrive: 0.92 };
const NONE = { cam: 0, fade: 0, fly: 0, k: 0, chartFade: 0, evm: false };
function stage(P) {
  if (P < T.evmIn) return { ...NONE, c: (C_TODAY * P) / T.evmIn };
  if (P < T.evmShown) {
    const u = (P - T.evmIn) / (T.evmShown - T.evmIn);
    return { c: C_TODAY, cam: smooth(clamp01(u / 0.25)), fade: smooth(clamp01((u - 0.08) / 0.25)), fly: clamp01((u - 0.12) / 0.45), k: clamp01((u - 0.42) / 0.58), chartFade: smooth(clamp01((u - 0.1) / 0.15)), evm: true };
  }
  if (P < T.evmOut) {
    const w = (P - T.evmShown) / (T.evmOut - T.evmShown);
    return { c: C_TODAY, cam: 1 - smooth(clamp01((w - 0.3) / 0.7)), fade: 1 - smooth(clamp01((w - 0.4) / 0.5)), fly: 1 - smooth(clamp01((w - 0.1) / 0.6)), k: 1, chartFade: 1 - smooth(clamp01((w - 0.1) / 0.4)), evm: true };
  }
  // Last step: bore on to the station wall (to 0.92), then the breakthrough and the first train.
  if (P < T.arrive) return { ...NONE, c: C_TODAY + ((C1 - C_TODAY) * (P - T.evmOut)) / (T.arrive - T.evmOut) };
  return { ...NONE, c: C1 + ((1 - C1) * (P - T.arrive)) / (1 - T.arrive) };
}
const phaseText = c => {
  if (c < C0) return `<b>${t('Hazırlık', 'Set-up')}</b> · ${t('TBM giriş şaftına indiriliyor', 'the TBM is lowered into the launch shaft')}`;
  if (c < C1) return `<b>${t('Kazı', 'Boring')}</b> · ${t('halka', 'ring')} ${int(state.f * RINGS)} / ${int(RINGS)}${hardAt(state.f) > 0.5 ? ' · ' + t('sert kaya: ilerleme yavaşladı', 'hard rock: progress slowed') : ''}`;
  return `<b>${t('Varış', 'Arrival')}</b> · ${t('TBM istasyon duvarını deldi; tünel ışıkları yandı, ilk tren perona geliyor', 'the TBM broke through the station wall; the tunnel lights are on, the first train pulls in')}`;
};

// ------------------------------------------------------------------ camera framing
// The view follows the machine along the tunnel: a 3/4 view from the front and above, so the street on top and the
// tunnel below read together. Wide screens get a slow swing; time stops with reduced motion.
const UP = new THREE.Vector3(0, 1, 0);
const camOff = new THREE.Vector3(14, 26, 62);
function drift(c, t) {
  const end = ramp(c, C1, C1 + (1 - C1) * 0.5);
  const tx = THREE.MathUtils.lerp(THREE.MathUtils.clamp(state.sx - (camera.aspect < 1 ? 5 : 2), -6, L + 6), L + (camera.aspect < 1 ? 10 : 9), end);
  const lift = 1 - ramp(c, 0, C0);
  controls.target.set(tx, -8 + 4 * lift, -2);
  const swing = CINE ? 0.06 * Math.sin(t * 0.05) : 0;
  const off = camOff.clone().applyAxisAngle(UP, swing).multiplyScalar((camera.aspect < 1 ? 0.95 : 1) * (1 + 0.12 * end));
  camera.position.copy(controls.target).add(off);
  camera.lookAt(controls.target);
  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).add(SUN_OFF);
}

// ------------------------------------------------------------------ loop
let progress = 0, playing = !EMBED;
const range = document.getElementById('prog');
const playBtn = document.getElementById('play');
range.addEventListener('input', () => { progress = range.value / 1000; });
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '❚❚' : '▶';
  playBtn.setAttribute('aria-pressed', playing);
};
function syncSize() {
  const cv = renderer.domElement;
  if (cv.clientWidth === innerWidth && cv.clientHeight === innerHeight) return;
  camera.aspect = innerWidth / Math.max(innerHeight, 1);
  camera.fov = camera.aspect < 1 ? (EMBED ? 56 : 50) : 32;
  if (EMBED && camera.aspect > 1.2) camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.18, 0, innerWidth, innerHeight);
  else if (EMBED && camera.aspect < 1) camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * 0.16, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (post) post.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  backdrop.resize(camera.aspect);
}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
let simT = 0;
syncSize();
// Warm up in the "today" state with the chart fully drawn: every instanced mesh and line then has something to draw,
// so no shader is first used mid-animation.
update(C_TODAY, 1);
setChart(1, 1, 1);
drift(0, 0);
// Draw the chart's drawing sheet at its final size now, so warm-up uploads it and the chart step does not redraw it.
fitChartCam();
await pause();
await warmUp(renderer, scene, camera, post);
update(0, 0);
setChart(0, 0, 0);
let lastPhase = '', warm = 0, follow = true;
controls.addEventListener('start', () => { follow = false; });
renderer.setAnimationLoop(() => {
  if (window.__hidden && warm > 2) { clock.getDelta(); return; }
  warm++;
  syncSize();
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) {
    progress = progress >= 1 ? 0 : Math.min(1, progress + dt / 60);
    range.value = Math.round(progress * 1000);
  }
  const st = stage(progress);
  const sdt = st.evm || REDUCED ? 0 : dt;
  simT += sdt;
  update(st.c, simT);
  flyRings(st.fly);
  if (st.cam > 0) { flash.visible = false; counter.visible = marker.visible = false; ctrDiv.style.opacity = 0; }
  ringLines.visible = st.fly <= 0;
  fadeSite(1 - 0.92 * st.fade);
  if (st.fade < 0.97) camera.layers.enable(1); else camera.layers.disable(1);
  sheet.set(0.9 * st.fade);
  renderer.shadowMap.autoUpdate = st.fade < 0.3; // (toggling sun.castShadow would recompile every shader)
  setChart(st.k, st.chartFade, ramp(st.fly, 0.85, 1));
  moveCamera(st.cam);
  if (!home && (EMBED || follow)) drift(st.c, simT);
  else if (!home) controls.update();
  const ph = st.evm && st.k > 0.6 ? evmText() : phaseText(st.c);
  if (ph !== lastPhase) document.getElementById('phase').innerHTML = lastPhase = ph;
  document.getElementById('pct').textContent = Math.round(progress * 100) + '%';
  document.getElementById('note').style.opacity = st.c > C0 * 0.6 || st.chartFade > 0.5 ? 1 : 0;
  mixers.forEach(m => m.update(sdt));
  if (post) post.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
Object.assign(window, { __ready: true, THREE, camera, controls, KPI, SER, setProgress: v => { progress = v; playing = false; range.value = Math.round(v * 1000); } });
</script>
</body>
</html>
